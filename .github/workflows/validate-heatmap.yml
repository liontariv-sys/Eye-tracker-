name: Validar correção do mapa de calor

on:
  push:
    paths:
      - ".github/workflows/validate-heatmap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes
        run: npm test
      - name: Compilação
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Remover validação temporária
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-heatmap.yml
          git commit -m "Remover validação temporária do mapa de calor"
          git push
