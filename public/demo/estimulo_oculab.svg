<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Estímulo de demonstração do LPNeC Oculab</title>
  <desc id="desc">Slide experimental neutro com título, ilustração principal e botão de ação para testar áreas de interesse.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eefaf7"/>
      <stop offset="1" stop-color="#dff1ef"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3441"/>
      <stop offset="1" stop-color="#075d5c"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22b7aa"/>
      <stop offset="1" stop-color="#74e28c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#174b52" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#background)"/>
  <circle cx="1150" cy="90" r="210" fill="#a8ffb2" opacity=".22"/>
  <circle cx="600" cy="730" r="310" fill="#66d0c6" opacity=".15"/>
  <g fill="#0e7d77" opacity=".16">
    <circle cx="80" cy="55" r="5"/><circle cx="112" cy="55" r="5"/><circle cx="144" cy="55" r="5"/>
    <circle cx="80" cy="87" r="5"/><circle cx="112" cy="87" r="5"/><circle cx="144" cy="87" r="5"/>
  </g>
  <g transform="translate(74 78)">
    <rect width="120" height="38" rx="19" fill="#d5f3ed"/>
    <circle cx="22" cy="19" r="8" fill="#14968c"/>
    <path d="M18 19h8M22 15v8" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <text x="40" y="24" fill="#176963" font-family="Arial, sans-serif" font-size="15" font-weight="700">PESQUISA</text>
  </g>
  <text x="74" y="174" fill="#0b3441" font-family="Arial, sans-serif" font-size="57" font-weight="800" letter-spacing="-1.8">O que orienta</text>
  <text x="74" y="238" fill="#0b3441" font-family="Arial, sans-serif" font-size="57" font-weight="800" letter-spacing="-1.8">a sua atenção?</text>
  <text x="76" y="304" fill="#496d72" font-family="Arial, sans-serif" font-size="23">Observe a composição e escolha o elemento</text>
  <text x="76" y="338" fill="#496d72" font-family="Arial, sans-serif" font-size="23">que mais desperta o seu interesse.</text>
