name: Aplicar atualização do mapa de calor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar atualização validada
        shell: bash
        run: |
          cat <<'PATCH_B64' | base64 -d | gzip -d > /tmp/oculab.patch
          
          PATCH_B64
          git apply --binary /tmp/oculab.patch
          rm .github/workflows/apply-oculab-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adicionar mapas de calor e exemplo completo de AOIs"
          git push
