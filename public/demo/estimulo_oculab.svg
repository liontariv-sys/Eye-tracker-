      <path d="M86 367c70-38 130-46 189-10 64 39 103 46 165 16" stroke="#63b9ff" stroke-width="7" opacity=".8"/>
      <path d="M103 277c52-66 106-90 167-73 78 22 111 69 166 67" stroke="#d4ff7c" stroke-width="7" opacity=".76"/>
    </g>
    <g fill="#efffff">
      <circle cx="103" cy="277" r="12"/><circle cx="87" cy="330" r="12"/><circle cx="86" cy="367" r="12"/>
      <circle cx="270" cy="204" r="12"/><circle cx="282" cy="242" r="12"/><circle cx="275" cy="357" r="12"/>
      <circle cx="436" cy="271" r="12"/><circle cx="441" cy="331" r="12"/><circle cx="440" cy="373" r="12"/>
