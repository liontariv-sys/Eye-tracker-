    <path d="M241 296c11-32 49-39 63-12 14 28-18 58-53 46-20-7-25-22-10-34Z" fill="#29b9a9"/>
    <circle cx="252" cy="287" r="7" fill="#0b4650"/><circle cx="278" cy="278" r="7" fill="#0b4650"/><circle cx="293" cy="300" r="7" fill="#0b4650"/>
    <text x="170" y="86" fill="#eafff9" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">PADRÕES VISUAIS</text>
  </g>
  <text x="75" y="674" fill="#51777a" font-family="Arial, sans-serif" font-size="15">Estímulo demonstrativo · dados fictícios para aprendizagem do Oculab</text>
</svg>
