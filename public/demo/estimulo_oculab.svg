    <text x="33" y="52" fill="#073e40" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1">CONTINUAR</text>
    <text x="33" y="82" fill="#073e40" font-family="Arial, sans-serif" font-size="25" font-weight="800">Ver próxima imagem</text>
